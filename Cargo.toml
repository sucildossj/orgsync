[workspace]
resolver = "2"
members = ["rust/p2p-core", "rust/seed-server", "rust/p2p-mobile", "rust/p2p-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
p2p-core = { path = "rust/p2p-core" }

anyhow      = "1"
thiserror   = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
postcard    = { version = "1", features = ["use-std"] }
blake3      = "1"
hex         = "0.4"
base64      = "0.22"
rand        = "0.8"
futures     = "0.3"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
rusqlite    = { version = "0.40", features = ["bundled", "functions", "trace"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
